<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Consulta Oficial</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/asset_m_brand_fix.png" />
  <link rel="apple-touch-icon" href="/assets/logos/asset_m_brand_fix.png" />
  <!-- Configurações de Compartilhamento (WhatsApp, Telegram, etc) -->
  <meta property="og:title" content="Portal de Consulta Oficial" />
  <meta property="og:description"
    content="Verifique de forma segura se há saldo disponível vinculado ao seu documento." />
  <meta property="og:image" content="https://consultavaloresdisponiveis.com.br/assets/logos/asset_m_brand.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://consultavaloresdisponiveis.com.br/" />
  <script>
    window.addEventListener('error', function(e) {
      if(e.message && e.message.includes('ResizeObserver')) return;
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:999999;padding:20px;font-family:sans-serif;font-size:12px;overflow:auto;max-height:50vh;';
      errDiv.innerHTML = '<b>JS Error:</b> ' + e.message + '<br><b>Source:</b> ' + e.filename + ':' + e.lineno + '<br><b>Stack:</b> ' + (e.error && e.error.stack ? e.error.stack.replace(/\n/g, '<br>') : '');
      document.body.appendChild(errDiv);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:orange;color:black;z-index:999999;padding:20px;font-family:sans-serif;font-size:12px;overflow:auto;max-height:50vh;';
      errDiv.innerHTML = '<b>Promise Error:</b> ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown');
      document.body.appendChild(errDiv);
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
