<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Consulta Oficial</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/asset_m_brand_fix.png" />
  <link rel="apple-touch-icon" href="/assets/logos/asset_m_brand_fix.png" />
  <!-- Configurações de Compartilhamento (WhatsApp, Telegram, etc) -->
  <meta property="og:title" content="Portal de Consulta Oficial" />
  <meta property="og:description"
    content="Verifique de forma segura se há saldo disponível vinculado ao seu documento." />
  <meta property="og:image" content="https://consultavaloresdisponiveis.com.br/assets/logos/asset_m_brand.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://consultavaloresdisponiveis.com.br/" />
  <script>
    window.addEventListener('error', function(e) {
      if(e.message && e.message.includes('ResizeObserver')) return;
      alert('JS Error: ' + e.message + '\nFile: ' + e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      alert('Promise Error: ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown'));
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
